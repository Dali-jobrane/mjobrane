<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Mohamed Ali Jobrane — Web Developer, Graphic Designer & Discord Specialist."
    >

    <meta
        name="theme-color"
        content="#08080a"
    >

    <title>M.JOBRANE — Web Developer & Creative Designer</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
    /* =========================================================
       AVATAR-STAGE STYLES (inserted)
    ========================================================= */

    :root {

        --bg: #030303;
        --surface: #0a0a0c;
        --white: #ffffff;
        --gray: #858585;

        --discord: #5865f2;
        --yellow: #f7df1e;
        --orange: #ff6337;
        --blue: #4f9cff;
        --pink: #ff5edc;
        --purple: #a66cff;
        --green: #4dff91;
    }

    html, body { width:100%; height:100%; }
    body { margin:0; background: radial-gradient(circle at 50% 45%, #161619 0%, #09090b 28%, #030303 70%, #000 100%); color: white; font-family: Inter, Arial, sans-serif; display:flex; align-items:center; justify-content:center; }

    .background-glow { position: fixed; width:650px; height:650px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,.055), transparent 65%); filter: blur(40px); pointer-events:none; animation: glowMove 8s ease-in-out infinite; }
    @keyframes glowMove { 0%,100%{ transform:scale(1); opacity:.6 } 50%{ transform:scale(1.15); opacity:1 } }

    .avatar-stage{ position: relative; width:560px; height:560px; display:flex; align-items:center; justify-content:center; }

    .grid{ position:absolute; width:470px; height:470px; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size:30px 30px; mask-image: radial-gradient(circle, black 0%, transparent 68%); -webkit-mask-image: radial-gradient(circle, black 0%, transparent 68%); opacity:.55; }

    .outer-ring{ position:absolute; width:470px; height:470px; border-radius:50%; border:1px solid rgba(255,255,255,.08); box-shadow: inset 0 0 40px rgba(255,255,255,.02); animation: rotateSlow 30s linear infinite; }
    .outer-ring::before{ content:""; position:absolute; inset:15px; border-radius:50%; border:1px dashed rgba(255,255,255,.07); }
    @keyframes rotateSlow{ from{ transform:rotate(0);} to{ transform:rotate(360deg);} }

    .orbit{ position:absolute; width:430px; height:430px; border-radius:50%; border:1px solid rgba(255,255,255,.12); border-left-color: rgba(255,255,255,.55); border-right-color: transparent; animation: orbit 12s linear infinite; }
    .orbit-dot{ position:absolute; width:6px; height:6px; top:18px; left:50%; border-radius:50%; background:white; box-shadow: 0 0 10px white, 0 0 25px white; }
    @keyframes orbit{ to { transform: rotate(360deg); } }

    .avatar-container{ position:relative; width:330px; height:370px; padding:1px; border-radius:28px; background: linear-gradient(135deg, rgba(255,255,255,.8), rgba(255,255,255,.05) 30%, rgba(255,255,255,.02) 70%, rgba(255,255,255,.5)); box-shadow: 0 40px 100px rgba(0,0,0,.85), 0 0 80px rgba(255,255,255,.035); z-index:10; animation: avatarFloat 6s ease-in-out infinite; }
    @keyframes avatarFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-9px);} }

    .avatar-inner{ width:100%; height:100%; position:relative; overflow:hidden; border-radius:27px; background:#070709; }

    .top-bar{ position:absolute; top:0; left:0; right:0; height:45px; display:flex; align-items:center; padding:0 16px; gap:7px; background: linear-gradient(180deg, rgba(10,10,12,.98), rgba(10,10,12,.75)); border-bottom:1px solid rgba(255,255,255,.08); z-index:20; }
    .dot{ width:8px; height:8px; border-radius:50%; }
    .dot.red{ background:#ff5f57; } .dot.yellow{ background:#febc2e; } .dot.green{ background:#28c840; }
    .file-name{ margin-left:8px; color:#666; font-family: "Courier New", monospace; font-size:9px; letter-spacing:.5px; }

    .avatar-image{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(1.01); filter: saturate(.9) contrast(1.08); transition: transform 1s ease, filter 1s ease; }
    .avatar-container:hover .avatar-image{ transform:scale(1.07); filter: saturate(1.05) contrast(1.12); }

    .image-overlay{ position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 30%, transparent 60%, rgba(0,0,0,.65)); z-index:3; pointer-events:none; }

    .scan{ position:absolute; left:0; width:100%; height:1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); box-shadow:0 0 15px white; z-index:15; animation: scan 5s ease-in-out infinite; }
    @keyframes scan{ 0%{ top:10%; opacity:0;} 15%{ opacity:.8;} 50%{ top:90%; opacity:.8;} 70%{ opacity:0;} 100%{ top:90%; opacity:0;} }

    .corner{ position:absolute; width:25px; height:25px; z-index:16; border-color: rgba(255,255,255,.75); }
    .corner.tl{ top:62px; left:15px; border-top:1px solid; border-left:1px solid; }
    .corner.tr{ top:62px; right:15px; border-top:1px solid; border-right:1px solid; }
    .corner.bl{ bottom:18px; left:15px; border-bottom:1px solid; border-left:1px solid; }
    .corner.br{ bottom:18px; right:15px; border-bottom:1px solid; border-right:1px solid; }

    .code-hud{ position:absolute; left:20px; bottom:18px; z-index:18; font-family:"Courier New", monospace; font-size:8px; color: rgba(255,255,255,.65); line-height:1.7; }
    .code-hud span{ color: rgba(255,255,255,.3); }

    .skills{ position:absolute; inset:0; z-index:30; pointer-events:none; }
    .skill{ position:absolute; width:58px; height:58px; display:flex; align-items:center; justify-content:center; border-radius:18px; background: linear-gradient(145deg, rgba(25,25,28,.96), rgba(6,6,8,.92)); border:1px solid rgba(255,255,255,.12); box-shadow: 0 20px 45px rgba(0,0,0,.6), inset 0 1px rgba(255,255,255,.08); backdrop-filter: blur(18px); transition:.35s ease; animation: skillFloat 5s ease-in-out infinite; }
    .skill:hover{ transform: translateY(-8px) scale(1.12); border-color: rgba(255,255,255,.35); }
    @keyframes skillFloat{ 0%,100%{ transform: translateY(0) rotate(0deg);} 50%{ transform: translateY(-11px) rotate(2deg);} }

    .skill.discord{ top:48px; left:40px; color:var(--discord); animation-delay:0s; }
    .discord-svg{ width:27px; height:27px; fill:currentColor; filter: drop-shadow(0 0 10px rgba(88,101,242,.6)); }

    .skill.javascript{ top:55px; right:35px; background:var(--yellow); color:#111; border-color:var(--yellow); font-family:Arial, sans-serif; font-size:17px; font-weight:900; animation-delay:.7s; }
    .skill.html{ right:12px; top:210px; color:var(--orange); font-family:"Courier New", monospace; font-size:14px; font-weight:900; animation-delay:1.2s; }
    .skill.design{ left:15px; top:220px; color:var(--pink); animation-delay:1.8s; }
    .design-svg{ width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; filter: drop-shadow(0 0 8px rgba(255,94,220,.5)); }
    .skill.figma{ left:42px; bottom:95px; color:var(--purple); font-size:18px; font-weight:900; animation-delay:2.4s; }
    .skill.css{ right:43px; bottom:78px; color:var(--blue); font-size:21px; font-weight:900; animation-delay:3s; }
    .skill.terminal{ right:18px; bottom:25px; color:var(--green); animation-delay:3.5s; }
    .terminal-svg{ width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; filter: drop-shadow(0 0 8px rgba(77,255,145,.5)); }

    .status{ position:absolute; right:-45px; bottom:82px; display:flex; align-items:center; gap:10px; padding:11px 15px; background: rgba(7,7,9,.88); border:1px solid rgba(255,255,255,.12); border-radius:13px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,.65); z-index:40; animation: statusFloat 5s ease-in-out infinite; }
    .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow: 0 0 8px var(--green), 0 0 18px rgba(77,255,145,.6); animation: pulse 2s infinite; }
    .status-text strong{ display:block; font-family:"Courier New", monospace; font-size:9px; letter-spacing:1px; }
    .status-text span{ display:block; margin-top:3px; color:#666; font-family:"Courier New", monospace; font-size:7px; }
    @keyframes statusFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }

    .name-tag{ position:absolute; bottom:12px; left:50%; transform: translateX(-50%); z-index:40; font-family:"Courier New", monospace; font-size:10px; letter-spacing:5px; white-space:nowrap; color:#555; }
    .name-tag strong{ color:white; }

    /* Responsive adjustments */
    @media (max-width:650px){ .avatar-stage{ width:370px; height:410px; } .outer-ring{ width:350px; height:350px; } .orbit{ width:320px; height:320px; } .grid{ width:340px; height:340px; } .avatar-container{ width:245px; height:285px; border-radius:22px; } .avatar-inner{ border-radius:21px; } .skill{ width:43px; height:43px; border-radius:13px; } .discord-svg, .design-svg, .terminal-svg{ width:19px; height:19px; } .skill.javascript, .skill.figma, .skill.css{ font-size:13px; } }

    /* Hide the old avatar elements if they exist */
    .hero-image, .avatar, .avatar-ring, .avatar-orbit { display: none !important; }
    </style>

</head>
<body>

<div class="background-glow"></div>

<div class="avatar-stage">

    <!-- BACKGROUND GRID + RINGS -->
    <div class="grid"></div>
    <div class="outer-ring"></div>
    <div class="orbit"><div class="orbit-dot"></div></div>

    <!-- MAIN AVATAR -->
    <div class="avatar-container">
        <div class="avatar-inner">

            <!-- TOP TERMINAL BAR -->
            <div class="top-bar">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="file-name">MJ / developer</span>
            </div>

            <!-- AVATAR IMAGE -->
            <img class="avatar-image" src="https://cdn.discordapp.com/attachments/1002645162914230322/1530576294172164116/A4393D69-DC3B-4126-B1B1-63DA5C3212E9.jpg" alt="MJ Developer">

            <!-- OVERLAY + SCAN + HUD -->
            <div class="image-overlay"></div>
            <div class="scan"></div>
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="code-hud"><span>01</span>&nbsp; const developer = "MJ";<br><span>02</span>&nbsp; developer.status = "online";</div>

        </div>
    </div>

    <!-- FLOATING SKILLS -->
    <div class="skills">
        <div class="skill discord" title="Discord">
            <svg class="discord-svg" viewBox="0 0 24 24"><path d="M19.54 4.27A16.9 16.9 0 0 0 15.35 3l-.52 1.06a15.6 15.6 0 0 0-5.66 0L8.65 3a16.9 16.9 0 0 0-4.19 1.27C1.8 8.27 1.08 12.17 1.44 16.02a17 17 0 0 0 5.13 2.59l1.24-1.7c-.68-.25-1.33-.56-1.94-.92l.47-.36c3.74 1.76 7.79 1.76 11.49 0l.48.36c-.62.36-1.27.67-1.95.92l1.24 1.7a17 17 0 0 0 5.13-2.59c.43-4.46-.74-8.32-3.19-11.75ZM8.1 14.43c-1.12 0-2.04-1.03-2.04-2.29s.9-2.29 2.04-2.29c1.15 0 2.06 1.04 2.04 2.29 0 1.26-.9 2.29-2.04 2.29Zm7.8 0c-1.12 0-2.04-1.03-2.04-2.29s.9-2.29 2.04-2.29c1.15 0 2.06 1.04 2.04 2.29 0 1.26-.9 2.29-2.04 2.29Z"/></svg>
        </div>
        <div class="skill javascript" title="JavaScript">JS</div>
        <div class="skill html" title="HTML / Web Development">&lt;/&gt;</div>
        <div class="skill design" title="UI / UX Design"><svg class="design-svg" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/><path d="m15 5 3 3"/></svg></div>
        <div class="skill figma" title="Figma">F</div>
        <div class="skill css" title="CSS">#</div>
        <div class="skill terminal" title="Development"><svg class="terminal-svg" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></div>
    </div>

    <div class="name-tag">&lt;<strong>M.jobrane</strong>/&gt;</div>

</div>

</body>
</html>
